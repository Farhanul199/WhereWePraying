name = "wherewepraying"
compatibility_date = "2026-08-01"
pages_build_output_dir = "."

# Created via the Cloudflare dashboard (Workers & Pages > D1 > Create
# database) or `wrangler d1 create wherewepraying-db`. After creating it,
# replace database_id below with the real ID Cloudflare gives you — this
# placeholder is only used for local `wrangler d1 execute --local` testing.
[[d1_databases]]
binding = "DB"
database_name = "wherewepraying-db"
database_id = "d38751de-0d94-4ccb-9c15-e3b1f94de6ee"

[[kv_namespaces]]
binding = "TAFSIR_KV"
id = "4945c6a85835456881bdcf45bfdf09dc"

[[kv_namespaces]]
binding = "SESSIONS"
id = "e732aee122aa45d9898e6bf3373b18d3"

[[r2_buckets]]
binding = "MASJID_PHOTOS"
bucket_name = "wherewepraying-masjid-photos"
