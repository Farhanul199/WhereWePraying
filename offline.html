<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>You're offline — WhereWePraying?</title>
<meta name="theme-color" content="#F4714E">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#FBF3E6; color:#241C15;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .card{
    max-width:380px; width:100%; text-align:center;
    background:#FFFFFF; border:1px solid #EFE1CC; border-radius:24px;
    padding:40px 28px; box-shadow:0 10px 28px rgba(60,42,24,.07);
  }
  .mark{
    width:64px; height:64px; margin:0 auto 20px; border-radius:20px;
    background:#FCE1D2; display:flex; align-items:center; justify-content:center;
  }
  h1{font-size:19px; font-weight:800; margin-bottom:8px;}
  p{font-size:13.5px; color:#8A7E70; line-height:1.5; margin-bottom:22px;}
  button{
    background:#F4714E; color:#fff; border:none; border-radius:12px;
    padding:12px 22px; font-weight:700; font-size:13.5px; cursor:pointer;
    width:100%;
  }
  button:active{background:#D85A38;}
  .hint{margin-top:16px; font-size:11.5px; color:#B4A896;}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D85A38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <line x1="12" y1="20" x2="12" y2="20.01"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>No connection right now, and this page hasn't been saved for offline use yet. Pages you've already visited will keep working.</p>
    <button onclick="window.location.href='/'">Try again</button>
    <div class="hint">WhereWePraying? — Find out. Get there. Catch the Jama'ah.</div>
  </div>
</body>
</html>
