<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — WhereWePraying?</title>
<link rel="icon" href="/assets/icons/icon-48.png">
<style>
  @font-face { font-family: "Manrope"; src: url("/assets/fonts/manrope-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
  :root { --bg: #FBF3EC; --card: #fff; --ink: #3b2a22; --muted: #7a6558; --coral: #F4714E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17120f; --card: #221b17; --ink: #f4e9e1; --muted: #bba89b; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--bg); color: var(--ink); font-family: "Manrope", system-ui, -apple-system, sans-serif; }
  .card { max-width: 420px; width: 100%; background: var(--card); border-radius: 32px; padding: 40px 28px; text-align: center;
          box-shadow: 0 10px 40px rgba(0,0,0,.08); }
  .arch { width: 72px; height: 88px; margin: 0 auto 20px; border: 3px solid var(--coral); border-bottom: none; border-radius: 36px 36px 0 0; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
  a { display: inline-block; background: var(--coral); color: #fff; text-decoration: none; font-weight: 700;
      padding: 14px 26px; border-radius: 999px; }
</style>
</head>
<body>
  <main class="card">
    <div class="arch" aria-hidden="true"></div>
    <h1>Page not found</h1>
    <p>This page doesn't exist or has moved.</p>
    <a href="/">Back to WhereWePraying?</a>
  </main>
</body>
</html>
