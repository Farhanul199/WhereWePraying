name: Build LG webOS app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Package .ipk
        run: |
          mkdir -p out
          ares-package webos --outdir out
          ls -la out
          cp out/*.ipk out/xp1-webos.ipk

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view webos-app-latest >/dev/null 2>&1 || gh release create webos-app-latest --title "LG webOS app" --notes "Latest LG webOS build"
          gh release upload webos-app-latest out/xp1-webos.ipk --clobber
