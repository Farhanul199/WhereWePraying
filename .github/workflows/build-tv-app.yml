name: Build TV app

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    paths:
      - 'tv-app/**'

# Security (27 Sep 2026): actions pinned to exact commits (a moved/hijacked
# tag can't swap in different code), and checkout doesn't keep the token.
# contents: write is only needed to publish the APK release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: tv-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp tv-app/app/build/outputs/apk/debug/app-debug.apk xp1-tv.apk

      - name: Publish download link
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: tv-app-latest
          name: WhereWePraying TV app (latest)
          body: Install on your TV with the Downloader app.
          files: xp1-tv.apk
          make_latest: true
