name: Back up database

# Daily copy of the D1 database into a PRIVATE R2 bucket (wwp-backups).
# Nothing from the database is ever printed to the (public) Actions log
# or stored as a (public) artifact — the file goes straight to R2.
#
# Needs two repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with Account > D1 > Edit and
#                          Account > Workers R2 Storage > Edit
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#
# Old copies are removed by an R2 lifecycle rule (set in the dashboard),
# not by this job.

on:
  schedule:
    - cron: '30 3 * * *'   # every day, 03:30 UTC
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Export D1
        run: |
          npx --yes wrangler@4 d1 export wherewepraying-db --remote --output=db.sql \
            || { echo "D1 export failed (check token permissions)"; exit 1; }
          gzip -9 db.sql
          echo "Exported $(du -h db.sql.gz | cut -f1)"

      - name: Upload to private R2 bucket
        run: |
          KEY="d1/$(date -u +%Y-%m-%d).sql.gz"
          npx --yes wrangler@4 r2 object put "wwp-backups/$KEY" --file=db.sql.gz --remote \
            || { echo "R2 upload failed (check bucket name and token permissions)"; exit 1; }
          echo "Saved $KEY"

      - name: Remove local copy
        if: always()
        run: rm -f db.sql db.sql.gz
