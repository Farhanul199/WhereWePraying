<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>WhereWePraying — Admin</title>
<style>
  :root{
    --coral:#F4714E;
    --cream:#FBF3EC;
    --text:#3A2E28;
    --muted:#8A7A70;
    --border:#EADFD6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--cream);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }
  .card{
    width:100%;
    max-width:640px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:32px;
    box-shadow:0 4px 24px rgba(0,0,0,0.04);
  }
  h1{
    font-size:22px;
    margin:0 0 4px;
  }
  .sub{
    color:var(--muted);
    font-size:14px;
    margin:0 0 28px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    margin-top:18px;
  }
  input[type=text],
  input[type=password],
  textarea{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:12px;
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    background:var(--cream);
  }
  textarea{
    min-height:160px;
    resize:vertical;
  }
  .hint{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
  }
  button{
    margin-top:24px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--coral);
    color:#fff;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  button:disabled{
    opacity:0.6;
    cursor:not-allowed;
  }
  #status{
    margin-top:16px;
    font-size:14px;
    padding:12px 14px;
    border-radius:12px;
    display:none;
  }
  #status.ok{
    display:block;
    background:#EAF6EE;
    color:#1F7A3E;
  }
  #status.err{
    display:block;
    background:#FBEAEA;
    color:#B3261E;
  }
  .lockrow{
    display:flex;
    gap:10px;
  }
  .lockrow input{flex:1;}
  .lockrow button{
    margin-top:0;
    width:auto;
    padding:0 20px;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:22px;
    border-bottom:1px solid var(--border);
  }
  .tab{
    background:none;
    border:none;
    margin:0;
    width:auto;
    padding:10px 4px;
    margin-right:20px;
    font-size:14px;
    font-weight:700;
    color:var(--muted);
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab.active{
    color:var(--coral);
    border-bottom-color:var(--coral);
  }
  .panel{display:none;}
  .panel.active{display:block;}
  .photo-card{
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    margin-bottom:14px;
    display:flex;
    gap:12px;
  }
  .photo-card img{
    width:96px;
    height:96px;
    object-fit:cover;
    border-radius:10px;
    flex:none;
    background:var(--cream);
  }
  .photo-card .pinfo{flex:1;min-width:0;}
  .photo-card .pname{font-weight:700;font-size:14px;}
  .photo-card .pnote{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-wrap;}
  .photo-card .pmeta{font-size:11.5px;color:var(--muted);margin-top:6px;}
  .photo-actions{display:flex;gap:8px;margin-top:10px;}
  .photo-actions button{
    margin-top:0;
    width:auto;
    padding:7px 14px;
    font-size:12.5px;
  }
  .btn-approve{background:#1F7A3E;}
  .btn-reject{background:#B3261E;}
  .empty-note{color:var(--muted);font-size:13.5px;text-align:center;padding:24px 0;}
  .refresh-row{display:flex;justify-content:flex-end;margin-bottom:4px;}
  .refresh-row button{
    margin-top:0;
    width:auto;
    padding:8px 14px;
    font-size:12.5px;
    background:var(--cream);
    color:var(--text);
    border:1px solid var(--border);
  }
</style>
</head>
<body>

<div class="card">
  <h1>WhereWePraying — Admin</h1>
  <p class="sub">Broadcast emails and review community-submitted masjid photos.</p>

  <div id="lockScreen">
    <label for="secretInput">Admin key</label>
    <div class="lockrow">
      <input type="password" id="secretInput" placeholder="Paste your BROADCAST_SECRET">
      <button id="unlockBtn">Unlock</button>
    </div>
    <p class="hint">This is the value you set in Cloudflare → Settings → Variables and secrets.</p>
  </div>

  <div id="mainScreen" style="display:none;">
    <div class="tabs">
      <button class="tab active" data-tab="broadcast">Broadcast</button>
      <button class="tab" data-tab="photos">Masjid Photos <span id="pendingBadge"></span></button>
    </div>

    <div class="panel active" id="panelBroadcast">
      <label for="subjectInput">Subject</label>
      <input type="text" id="subjectInput" placeholder="e.g. New feature: Prayer Times world clocks">

      <label for="messageInput">Message</label>
      <textarea id="messageInput" placeholder="Write your update here..."></textarea>
      <p class="hint">Plain text — each line becomes its own paragraph. Matches the style of your welcome email.</p>

      <label for="buttonTextInput">Button text (optional)</label>
      <input type="text" id="buttonTextInput" placeholder="e.g. Check it out">

      <label for="buttonUrlInput">Button link (optional)</label>
      <input type="text" id="buttonUrlInput" placeholder="https://wherewepraying.com/...">

      <button id="sendBtn">Send to all subscribers</button>
      <div id="status"></div>
    </div>

    <div class="panel" id="panelPhotos">
      <div class="refresh-row">
        <button id="refreshPhotosBtn">Refresh</button>
      </div>
      <div id="photosList"><p class="empty-note">Loading…</p></div>
      <div id="photoStatus"></div>
    </div>
  </div>
</div>

<script>
  const lockScreen = document.getElementById('lockScreen');
  const mainScreen = document.getElementById('mainScreen');
  const secretInput = document.getElementById('secretInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const subjectInput = document.getElementById('subjectInput');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');

  let broadcastKey = '';

  unlockBtn.addEventListener('click', function(){
    const val = secretInput.value.trim();
    if(!val){ return; }
    broadcastKey = val;
    lockScreen.style.display = 'none';
    mainScreen.style.display = 'block';
    loadPendingPhotos();
  });

  secretInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') unlockBtn.click();
  });

  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById('panelBroadcast').classList.toggle('active', tab.dataset.tab === 'broadcast');
      document.getElementById('panelPhotos').classList.toggle('active', tab.dataset.tab === 'photos');
      if(tab.dataset.tab === 'photos') loadPendingPhotos();
    });
  });

  sendBtn.addEventListener('click', async function(){
    const subject = subjectInput.value.trim();
    const message = messageInput.value.trim();
    const buttonText = document.getElementById('buttonTextInput').value.trim();
    const buttonUrl = document.getElementById('buttonUrlInput').value.trim();

    if(!subject || !message){
      showStatus('Please fill in both subject and message.', 'err');
      return;
    }

    const confirmed = confirm('Send this email to every subscriber? This cannot be undone.');
    if(!confirmed) return;

    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending…';
    statusEl.style.display = 'none';

    try{
      const res = await fetch('/api/broadcast', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Broadcast-Key': broadcastKey,
          'X-Device-Id': 'admin-broadcast-panel'
        },
        body: JSON.stringify({ subject: subject, message: message, buttonText: buttonText, buttonUrl: buttonUrl })
      });

      const data = await res.json();

      if(!res.ok){
        showStatus('Error: ' + (data.error || 'Request failed'), 'err');
      } else if(data.errors && data.errors.length){
        showStatus('Sent ' + data.sent + ' of ' + data.total + ', but some batches failed. Check console for details.', 'err');
        console.error(data.errors);
      } else {
        showStatus('Sent to ' + data.sent + ' subscriber(s) successfully! 🤍', 'ok');
        subjectInput.value = '';
        messageInput.value = '';
        document.getElementById('buttonTextInput').value = '';
        document.getElementById('buttonUrlInput').value = '';
      }
    }catch(err){
      showStatus('Network error — please try again.', 'err');
    }finally{
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send to all subscribers';
    }
  });

  function showStatus(msg, type){
    statusEl.textContent = msg;
    statusEl.className = type;
    statusEl.style.display = 'block';
  }

  // ---- Masjid photo review queue ----
  const photosList = document.getElementById('photosList');
  const photoStatusEl = document.getElementById('photoStatus');
  const pendingBadge = document.getElementById('pendingBadge');
  document.getElementById('refreshPhotosBtn').addEventListener('click', loadPendingPhotos);

  function showPhotoStatus(msg, type){
    photoStatusEl.textContent = msg;
    photoStatusEl.className = type;
    photoStatusEl.style.display = 'block';
    setTimeout(function(){ photoStatusEl.style.display = 'none'; }, 3500);
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  async function loadPendingPhotos(){
    if(!broadcastKey) return;
    photosList.innerHTML = '<p class="empty-note">Loading…</p>';
    try{
      const res = await fetch('/api/community/photos?status=pending', {
        headers: { 'X-Broadcast-Key': broadcastKey }
      });
      const data = await res.json();
      if(!res.ok){
        photosList.innerHTML = '<p class="empty-note">Error: ' + escapeHtml(data.error || 'Request failed') + '</p>';
        return;
      }
      const photos = data.photos || [];
      pendingBadge.textContent = photos.length ? '(' + photos.length + ')' : '';
      if(!photos.length){
        photosList.innerHTML = '<p class="empty-note">No photos waiting for review. 🎉</p>';
        return;
      }
      photosList.innerHTML = photos.map(function(p){
        return '<div class="photo-card" data-id="' + p.id + '">' +
          '<img src="' + escapeHtml(p.url) + '" alt="">' +
          '<div class="pinfo">' +
            '<div class="pname">' + escapeHtml(p.masjid_name || 'Unnamed masjid') + '</div>' +
            (p.note ? '<div class="pnote">' + escapeHtml(p.note) + '</div>' : '') +
            '<div class="pmeta">Submitted by ' + escapeHtml(p.username || p.email || 'a user') + ' · ' + new Date(p.created_at).toLocaleString() + '</div>' +
            '<div class="photo-actions">' +
              '<button class="btn-approve" data-action="approve" data-id="' + p.id + '">Approve</button>' +
              '<button class="btn-reject" data-action="reject" data-id="' + p.id + '">Reject</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }catch(err){
      photosList.innerHTML = '<p class="empty-note">Network error — please try again.</p>';
    }
  }

  photosList.addEventListener('click', async function(e){
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const id = btn.dataset.id;
    const status = btn.dataset.action === 'approve' ? 'approved' : 'rejected';
    btn.disabled = true;
    try{
      const res = await fetch('/api/community/photos', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Broadcast-Key': broadcastKey
        },
        body: JSON.stringify({ action: 'review', photoId: id, status: status })
      });
      const data = await res.json();
      if(!res.ok){
        showPhotoStatus('Error: ' + (data.error || 'Request failed'), 'err');
        btn.disabled = false;
        return;
      }
      showPhotoStatus(status === 'approved' ? 'Photo approved.' : 'Photo rejected.', 'ok');
      const card = photosList.querySelector('.photo-card[data-id="' + id + '"]');
      if(card) card.remove();
      const remaining = photosList.querySelectorAll('.photo-card').length;
      pendingBadge.textContent = remaining ? '(' + remaining + ')' : '';
      if(!remaining) photosList.innerHTML = '<p class="empty-note">No photos waiting for review. 🎉</p>';
    }catch(err){
      showPhotoStatus('Network error — please try again.', 'err');
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
