<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>WhereWePraying — Reports</title>
<style>
  :root{
    --coral:#F4714E; --cream:#FBF3EC; --text:#3A2E28; --muted:#8A7A70; --border:#EADFD6;
    --ok:#2E7D5B; --okbg:#E7F1EC; --warn:#B4541F; --warnbg:#FBEDE1; --err:#B23B3B; --errbg:#FBE4E4;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);color:var(--text);display:flex;justify-content:center;padding:40px 16px;}
  .card{width:100%;max-width:840px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px;}
  .row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .row input{flex:1;padding:11px 13px;font:inherit;font-size:15px;border:1px solid var(--border);border-radius:11px;}
  button{padding:10px 16px;font:inherit;font-weight:700;border-radius:11px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text);}
  button.primary{background:var(--coral);color:#fff;border:none;}
  button.danger{background:var(--err);color:#fff;border:none;}
  button:disabled{opacity:.5;cursor:default;}
  .tabs button.active{background:var(--text);color:#fff;border-color:var(--text);}
  .hidden{display:none;}
  .box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;}
  .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .pill{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;white-space:nowrap;display:inline-block;margin-right:6px;}
  .pill.n{background:var(--errbg);color:var(--err);}
  .pill.t{background:#EEE;color:var(--muted);}
  .pill.gone{background:var(--okbg);color:var(--ok);}
  .snap{white-space:pre-wrap;background:var(--cream);border-radius:10px;padding:12px;margin:12px 0;font-size:14px;line-height:1.5;}
  .meta{color:var(--muted);font-size:13px;margin-top:4px;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:30px 0;}
</style>
</head>
<body>
<div class="card">

  <div id="lockScreen">
    <h1>Community reports</h1>
    <p class="sub">Enter the admin key to continue.</p>
    <div class="row">
      <input type="password" id="secretInput" placeholder="Admin key" autocomplete="off">
      <button class="primary" id="unlockBtn">Unlock</button>
    </div>
  </div>

  <div id="mainScreen" class="hidden">
    <h1>Community reports</h1>
    <p class="sub">Posts with 3 or more open reports are already hidden from everyone until you decide.</p>
    <div class="row tabs">
      <button data-status="open" class="active">Open</button>
      <button data-status="actioned">Removed</button>
      <button data-status="dismissed">Dismissed</button>
      <button data-status="all">All</button>
      <button data-status="banned">Banned</button>
      <button id="refreshBtn">Refresh</button>
    </div>
    <div id="list"><p class="empty">Loading…</p></div>
  </div>
</div>

<script>
(function(){
  var KEY = '';
  var STATUS = 'open';
  var $ = function(id){ return document.getElementById(id); };
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function when(ts){ return ts ? new Date(ts).toLocaleString() : ''; }

  function unlock(){
    var v = $('secretInput').value.trim();
    if(!v) return;
    KEY = v;
    $('lockScreen').classList.add('hidden');
    $('mainScreen').classList.remove('hidden');
    load();
  }
  $('unlockBtn').addEventListener('click', unlock);
  $('secretInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') unlock(); });

  document.querySelectorAll('.tabs [data-status]').forEach(function(b){
    b.addEventListener('click', function(){
      STATUS = b.dataset.status;
      document.querySelectorAll('.tabs [data-status]').forEach(function(x){ x.classList.toggle('active', x === b); });
      load();
    });
  });
  $('refreshBtn').addEventListener('click', load);

  async function load(){
    var list = $('list');
    list.innerHTML = '<p class="empty">Loading…</p>';
    try{
      var res = await fetch('/api/admin/reports?status=' + encodeURIComponent(STATUS), { headers: { 'X-Broadcast-Key': KEY } });
      var data = await res.json();
      if(res.status === 401){ list.innerHTML = '<p class="empty">Wrong key. Reload the page and try again.</p>'; return; }
      if(!res.ok){ list.innerHTML = '<p class="empty">' + esc(data.error || 'Failed to load.') + '</p>'; return; }
      if(STATUS === 'banned'){
        var bans = data.banned || [];
        list.innerHTML = bans.length ? bans.map(bannedCard).join('') : '<p class="empty">No banned accounts.</p>';
        return;
      }
      var rows = data.reports || [];
      if(!rows.length){ list.innerHTML = '<p class="empty">Nothing here. 🎉</p>'; return; }
      list.innerHTML = rows.map(card).join('');
    }catch(e){
      list.innerHTML = '<p class="empty">Network error.</p>';
    }
  }

  function card(r){
    var open = r.status === 'open';
    return '<div class="box" data-type="' + esc(r.target_type) + '" data-id="' + esc(r.target_id) + '">' +
      '<div class="head"><div>' +
        '<span class="pill n">' + esc(r.report_count) + ' report' + (r.report_count == 1 ? '' : 's') + '</span>' +
        '<span class="pill t">' + esc(r.target_type) + '</span>' +
        (r.still_exists ? '' : '<span class="pill gone">already deleted</span>') +
      '</div><div class="meta">' + esc(when(r.last_reported)) + '</div></div>' +
      '<div class="meta">By <b>' + esc(r.author) + '</b>' + (r.author_banned ? ' (banned)' : '') + ' · Reasons: ' + esc(r.reasons) + '</div>' +
      '<div class="snap">' + esc(r.snapshot) + '</div>' +
      (r.details ? '<div class="meta">Reporter notes: ' + esc(r.details) + '</div>' : '') +
      (open ? '<div class="actions">' +
        '<button data-decision="dismiss">Keep it (dismiss)</button>' +
        '<button class="primary" data-decision="remove">Remove post</button>' +
        '<button class="danger" data-decision="remove_ban">Remove + ban author</button>' +
      '</div>' : '<div class="meta">Status: ' + esc(r.status) + '</div>') +
    '</div>';
  }

  function bannedCard(u){
    return '<div class="box" data-user="' + esc(u.id) + '"><div class="head"><div>' +
      '<b>' + esc(u.username || '(no username)') + '</b><div class="meta">' + esc(u.email) + '</div></div>' +
      '<div class="meta">Banned ' + esc(when(u.banned_at)) + '</div></div>' +
      '<div class="actions"><button data-unban="1">Unban</button></div></div>';
  }

  $('list').addEventListener('click', async function(e){
    var unban = e.target.closest('[data-unban]');
    if(unban){
      var ubox = unban.closest('.box');
      if(!confirm('Let this person post again?')) return;
      unban.disabled = true;
      try{
        var ures = await fetch('/api/admin/reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Broadcast-Key': KEY },
          body: JSON.stringify({ action: 'unban', userId: ubox.dataset.user })
        });
        var udata = await ures.json();
        if(!ures.ok){ alert(udata.error || 'Failed.'); unban.disabled = false; return; }
        ubox.remove();
        if(!$('list').children.length) $('list').innerHTML = '<p class="empty">No banned accounts.</p>';
      }catch(err){ alert('Network error.'); unban.disabled = false; }
      return;
    }
    var btn = e.target.closest('[data-decision]');
    if(!btn) return;
    var box = btn.closest('.box');
    var decision = btn.dataset.decision;
    if(decision === 'remove_ban' && !confirm('Delete this post and stop its author posting again?')) return;
    box.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
    try{
      var res = await fetch('/api/admin/reports', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Broadcast-Key': KEY },
        body: JSON.stringify({ targetType: box.dataset.type, targetId: box.dataset.id, decision: decision })
      });
      var data = await res.json();
      if(!res.ok){ alert(data.error || 'Failed.'); box.querySelectorAll('button').forEach(function(b){ b.disabled = false; }); return; }
      box.remove();
      if(!$('list').children.length) $('list').innerHTML = '<p class="empty">Nothing here. 🎉</p>';
    }catch(err){
      alert('Network error.');
      box.querySelectorAll('button').forEach(function(b){ b.disabled = false; });
    }
  });
})();
</script>
</body>
</html>
